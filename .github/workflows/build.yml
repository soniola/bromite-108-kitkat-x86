name: Bromite 108 KitKat x86 (free runner attempt)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Report free disk / RAM
        run: |
          echo "== disk =="; df -h . /mnt 2>/dev/null || true
          echo "== ram =="; free -h
          echo "== cpu =="; nproc

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git python3 unzip curl xz-utils \
            lsb-release software-properties-common openjdk-11-jdk \
            gperf bison flex \
            libnss3-dev libglib2.0-dev libatspi2.0-dev libatk-bridge2.0-dev \
            libx11-dev libxcomposite-dev libxdamage-dev libxext-dev \
            libxfixes-dev libxrandr-dev libxrender-dev libxcb1-dev libxtst-dev \
            libdrm-dev libgbm-dev libasound2-dev \
            libpango1.0-dev libcairo2-dev libfontconfig1-dev libfreetype6-dev \
            libgtk-3-dev fonts-liberation ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-bromite108-kitkat-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-bromite108-kitkat-${{ runner.os }}-

      - name: depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git depot_tools
          echo "$PWD/depot_tools" >> $GITHUB_PATH

      - name: Fetch Chromium 108.0.5359.156 (pinned, no history)
        run: |
          export PATH="$PWD/depot_tools:$PATH"
          mkdir -p chromium && cd chromium
          cat > .gclient <<'EOF'
          solutions = [
            {
              'name': 'src',
              'url': 'https://chromium.googlesource.com/chromium/src.git@108.0.5359.156',
              'custom_deps': {},
              # "small" skips two stale GCS hooks (traffic_annotation_auditor,
              # instrumented_libraries) whose 2022 objects were deleted from
              # Google Storage. These are not needed to build an APK. The
              # clang/NDK/SDK hooks still run.
              'custom_vars': { 'checkout_configuration': 'small' },
            },
          ]
          target_os = ['android']
          EOF
          gclient sync --no-history --nohooks -D
          cd src
          echo "== checked out revision =="
          git rev-parse HEAD
          echo "== config.gni default minSdk (must be 23 in stock 108) =="
          grep -n "default_min_sdk_version" build/config/android/config.gni | head -3
          echo "== source size =="; du -sh . 2>/dev/null || true
          echo "== disk after fetch =="; df -h . | tail -1

      - name: Install toolchain (gclient hooks)
        run: |
          export PATH="$GITHUB_WORKSPACE/depot_tools:$PATH"
          cd "$GITHUB_WORKSPACE/chromium"
          gclient runhooks || echo "AVISO: un hook opcional falló (objeto GCS antiguo); se continúa"
          echo "== verificar toolchain clang =="
          ls src/third_party/llvm-build/Release+Asserts/bin/clang 2>/dev/null && echo "CLANG OK" || echo "CLANG FALTA"
          echo "== disk after hooks =="; df -h . | tail -1

      - name: Apply KitKat minSdk patch
        run: |
          cd "$GITHUB_WORKSPACE/chromium/src"
          # Stock 108 declares default_min_sdk_version = 23 inside declare_args().
          # Lower it to 19 (KitKat / API 19). args.gn also overrides it below.
          sed -i 's/default_min_sdk_version = 23/default_min_sdk_version = 19/' \
            build/config/android/config.gni
          echo "== patched config.gni =="
          grep -n "default_min_sdk_version" build/config/android/config.gni | head -3

      - name: Configure GN
        run: |
          export PATH="$GITHUB_WORKSPACE/depot_tools:$PATH"
          cd "$GITHUB_WORKSPACE/chromium/src"
          mkdir -p out/kitkat
          cat > out/kitkat/args.gn <<'EOF'
          target_os = "android"
          target_cpu = "x86"
          is_debug = false
          is_official_build = false
          cc_wrapper = "ccache"
          symbol_level = 0
          exclude_unwind_tables = true
          default_min_sdk_version = 19
          disable_android_lint = true
          use_errorprone_java_compiler = false
          enable_vr = false
          enable_nacl = false
          chrome_pgo_phase = 0
          use_debug_fission = false
          EOF
          gn gen out/kitkat

      - name: Build chrome_public_apk
        run: |
          export PATH="$GITHUB_WORKSPACE/depot_tools:$PATH"
          cd "$GITHUB_WORKSPACE/chromium/src"
          autoninja -C out/kitkat chrome_public_apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bromite-108-kitkat-x86
          path: chromium/src/out/kitkat/apks/ChromePublic.apk
          if-no-files-found: error

      - name: Final disk report
        if: always()
        run: df -h . | tail -1
